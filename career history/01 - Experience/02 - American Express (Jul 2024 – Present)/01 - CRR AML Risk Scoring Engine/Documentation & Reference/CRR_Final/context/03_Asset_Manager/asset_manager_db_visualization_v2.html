<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRR Asset Manager - Complete Scenario Visualization</title>
    <style>
        :root {
            --bg: #fff;
            --bg-light: #f8f9fa;
            --text: #212529;
            --muted: #6c757d;
            --border: #dee2e6;
            --green: #28a745;
            --green-bg: #d4edda;
            --yellow: #ffc107;
            --yellow-bg: #fff3cd;
            --red: #dc3545;
            --red-bg: #f8d7da;
            --blue: #007bff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 12px;
            padding: 10px;
        }

        .header {
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 1.2rem;
        }

        .tabs {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .tab {
            padding: 4px 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            cursor: pointer;
            border-radius: 3px;
            font-size: 10px;
        }

        .tab:hover {
            background: var(--bg-light);
        }

        .tab.active {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue);
        }

        .step-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 8px;
            background: var(--bg-light);
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .step-btn {
            padding: 4px 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            cursor: pointer;
            border-radius: 3px;
            font-size: 10px;
        }

        .step-btn:hover {
            background: var(--blue);
            color: #fff;
        }

        .step-btn:disabled {
            opacity: 0.5;
        }

        .step-ind {
            font-weight: 600;
            font-size: 11px;
        }

        .step-flow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .step-box {
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 9px;
            background: var(--bg);
        }

        .step-box.current {
            border-color: var(--blue);
            background: #e7f1ff;
            font-weight: 600;
        }

        .step-box.done {
            border-color: var(--green);
            background: var(--green-bg);
        }

        .step-arrow {
            color: var(--muted);
            font-size: 10px;
        }

        .action {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 10px;
        }

        .action h3 {
            font-size: 11px;
            margin-bottom: 4px;
            color: var(--blue);
        }

        .action p {
            color: var(--muted);
            font-size: 10px;
        }

        .status-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .status-card {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 10px;
        }

        .status-card h4 {
            font-size: 9px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .status-val {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
        }

        .s-draft {
            background: var(--yellow-bg);
            color: #856404;
        }

        .s-sandbox {
            background: #cce5ff;
            color: #004085;
        }

        .s-prod {
            background: var(--green-bg);
            color: #155724;
        }

        .s-working {
            background: #cce5ff;
            color: #004085;
        }

        .s-cancelled {
            background: var(--red-bg);
            color: #721c24;
        }

        .s-rejected {
            background: var(--red-bg);
            color: #721c24;
        }

        .legend {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            font-size: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        .l-new {
            background: var(--green-bg);
            border: 1px solid var(--green);
        }

        .l-upd {
            background: var(--yellow-bg);
            border: 1px solid var(--yellow);
        }

        .l-del {
            background: var(--red-bg);
            border: 1px solid var(--red);
        }

        .tables {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tbl-card {
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .tbl-card.affected {
            border-color: var(--blue);
            border-width: 2px;
        }

        .tbl-hdr {
            padding: 4px 8px;
            background: var(--bg-light);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tbl-hdr h3 {
            font-size: 10px;
            font-weight: 600;
        }

        .tbl-hdr .desc {
            font-size: 8px;
            color: var(--muted);
        }

        .tbl-badge {
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 8px;
            background: #e7f1ff;
            color: var(--blue);
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 9px;
        }

        th {
            text-align: left;
            padding: 3px 6px;
            background: var(--bg-light);
            font-size: 8px;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 3px 6px;
            border-bottom: 1px solid #f0f0f0;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .row-new {
            background: var(--green-bg);
        }

        .row-upd {
            background: var(--yellow-bg);
        }

        .row-del {
            background: var(--red-bg);
            text-decoration: line-through;
            opacity: 0.6;
        }

        .pill {
            display: inline-block;
            padding: 1px 5px;
            border-radius: 6px;
            font-size: 8px;
            font-weight: 600;
        }

        .pill-draft {
            background: #fff3cd;
            color: #856404;
        }

        .pill-sandbox {
            background: #cce5ff;
            color: #004085;
        }

        .pill-production {
            background: #d4edda;
            color: #155724;
        }

        .pill-deprecated {
            background: #e2e3e5;
            color: #383d41;
        }

        .pill-working {
            background: #cce5ff;
            color: #004085;
        }

        .pill-merged {
            background: #d4edda;
            color: #155724;
        }

        .pill-cancelled {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>CRR Asset Manager - Complete DB Changes</h1>

    <div class="tabs" id="tabs"></div>
    <div class="step-nav">

    </div>
    <div class="tables" id="tbls"></div>

                n: "13. Version Cap (10)", s: [
                    { t: "At Version 10", d: "Sandbox has 10 versions. Max reached.", sb: "WORKING(V10)", as: "SANDBOX", af: [], ch: {} },
                    { t: "Try New Version", d: "BLOCKED! Version cap reached.", sb: "BLOCKED", as: "N/A", af: [], ch: {} },
                    { t: "Must Archive", d: "User must archive/delete sandbox and create new.", sb: "ARCHIVE_REQUIRED", as: "N/A", af: [], ch: {} }
                ]
            }
        };

        let cur = 'createAsset', step = 0;

        function initTabs() {
            document.getElementById('tabs').innerHTML = Object.entries(S).map(([k, v]) =>
                `<button class="tab ${k === cur ? 'active' : ''}" onclick="sel('${k}')">${v.n}</button>`
            ).join('');
        }

        function sel(k) { cur = k; step = 0; initTabs(); render(); }
        function prev() { if (step > 0) { step--; render(); } }
        function next() { if (step < S[cur].s.length - 1) { step++; render(); } }

        function render() {
            const sc = S[cur], st = sc.s[step];
            document.getElementById('ind').textContent = `${step + 1}/${sc.s.length}`;
            document.getElementById('prev').disabled = step === 0;
            document.getElementById('next').disabled = step === sc.s.length - 1;
            document.getElementById('flow').innerHTML = sc.s.map((s, i) => {
                let c = i < step ? 'done' : (i === step ? 'current' : '');
                let a = i < sc.s.length - 1 ? '<span class="step-arrow">→</span>' : '';
                return `<div class="step-box ${c}">${s.t}</div>${a}`;
            }).join('');
            document.getElementById('title').textContent = st.t;
            document.getElementById('desc').textContent = st.d;
            const sb = document.getElementById('sbSta');
            sb.textContent = st.sb;
            sb.className = 'status-val s-' + st.sb.toLowerCase().replace(/[^a-z]/g, '').substring(0, 8);
            const as = document.getElementById('asSta');
            as.textContent = st.as;
            as.className = 'status-val s-' + st.as.toLowerCase().replace(/[^a-z]/g, '').substring(0, 8);
            renderTbls(st);
        }

        function renderTbls(st) {
            let h = '';
            Object.entries(T).forEach(([n, t]) => {
                const af = st.af.includes(n), ch = st.ch[n] || {};
                h += `<div class="tbl-card ${af ? 'affected' : ''}"><div class="tbl-hdr"><div><h3>${n}</h3><span class="desc">${t.d}</span></div>${af ? '<span class="tbl-badge">AFFECTED</span>' : ''}</div><table><thead><tr>${t.c.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>`;
                t.r.forEach((r, i) => {
                    let rc = '', dr = [...r];
                    if (ch.u) { const u = ch.u.find(x => x[0] === i); if (u) { dr = u[1]; rc = 'row-upd'; } }
                    if (ch.d && ch.d.includes(i)) rc = 'row-del';
                    h += `<tr class="${rc}">${dr.map((c, j) => {
                        if (t.c[j] === 'status') return `<td><span class="pill pill-${c.toLowerCase()}">${c}</span></td>`;
                        return `<td>${c}</td>`;
                    }).join('')}</tr>`;
                });
                if (ch.n) ch.n.forEach(r => {
                    h += `<tr class="row-new">${r.map((c, j) => {
                        if (t.c[j] === 'status') return `<td><span class="pill pill-${c.toLowerCase()}">${c}</span></td>`;
                        return `<td>${c}</td>`;
                    }).join('')}</tr>`;
                });
                h += '</tbody></table></div>';
            });
            document.getElementById('tbls').innerHTML = h;
        }

        document.addEventListener('DOMContentLoaded', () => { initTabs(); render(); });
    </script>
</body>

</html>
